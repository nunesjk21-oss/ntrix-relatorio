# Robô NTRIX — lê os dados do Firebase, REMOVE os PINs, CRIPTOGRAFA e salva em ntrix-dados.json.enc
# Roda toda segunda 11:30 UTC (08:30 BRT) e também pode ser rodado na mão (Run workflow).
# Login anônimo no Firebase (igual ao app). A senha de criptografia fica no segredo NTRIX_PASS do repositório.
name: NTRIX - snapshot semanal

on:
  schedule:
    - cron: "30 11 * * 1"   # segunda-feira, 11:30 UTC (08:30 de Brasília)
  workflow_dispatch: {}      # botão "Run workflow" para rodar na hora

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Puxar dados do NTRIX (Firebase)
        run: |
          python3 - <<'PY'
          import json, time, urllib.request, urllib.error

          API_KEY    = "AIzaSyBCk8ifYe4e8_ucC2ti9WwaM98jAEnx8eg"
          PROJECT_ID = "ntrix-2f9be"
          COLECOES   = ["tasks", "profiles", "activity"]

          def post(url, body):
              data = json.dumps(body).encode()
              req = urllib.request.Request(url, data=data,
                    headers={"Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.load(r)

          def get(url, token):
              req = urllib.request.Request(url,
                    headers={"Authorization": "Bearer " + token})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.load(r)

          def val(v):
              if "stringValue"    in v: return v["stringValue"]
              if "integerValue"   in v: return int(v["integerValue"])
              if "doubleValue"    in v: return v["doubleValue"]
              if "booleanValue"   in v: return v["booleanValue"]
              if "timestampValue" in v: return v["timestampValue"]
              if "nullValue"      in v: return None
              if "mapValue"       in v: return fields(v["mapValue"].get("fields", {}))
              if "arrayValue"     in v: return [val(x) for x in v["arrayValue"].get("values", [])]
              if "referenceValue" in v: return v["referenceValue"]
              return None

          def fields(f):
              return {k: val(v) for k, v in f.items()}

          auth = post(
              "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=" + API_KEY,
              {"returnSecureToken": True})
          token = auth["idToken"]

          base = ("https://firestore.googleapis.com/v1/projects/%s/databases/(default)/documents"
                  % PROJECT_ID)

          saida = {"gerado_em": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())}

          for col in COLECOES:
              docs, page = [], None
              while True:
                  url = base + "/" + col + "?pageSize=300"
                  if page:
                      url += "&pageToken=" + page
                  try:
                      resp = get(url, token)
                  except urllib.error.HTTPError as e:
                      print("Aviso: coleção '%s' falhou (%s)" % (col, e.code))
                      break
                  for d in resp.get("documents", []):
                      item = fields(d.get("fields", {}))
                      item["_id"] = d["name"].split("/")[-1]
                      item.pop("attachments", None)    # anexos não vão no relatório
                      if col == "profiles":
                          item.pop("pin", None)        # NUNCA exporta o PIN de login
                      docs.append(item)
                  page = resp.get("nextPageToken")
                  if not page:
                      break
              saida[col] = docs
              print("%s: %d documentos" % (col, len(docs)))

          with open("ntrix-dados.json", "w", encoding="utf-8") as f:
              json.dump(saida, f, ensure_ascii=False, indent=1)
          print("ntrix-dados.json gerado (em claro, temporário).")
          PY

      - name: Criptografar o snapshot
        env:
          NTRIX_PASS: ${{ secrets.NTRIX_PASS }}
        run: |
          if [ -z "$NTRIX_PASS" ]; then
            echo "ERRO: o segredo NTRIX_PASS não está configurado no repositório."; exit 1
          fi
          openssl enc -aes-256-cbc -pbkdf2 -iter 100000 -salt -a \
            -in ntrix-dados.json -out ntrix-dados.json.enc -pass env:NTRIX_PASS
          rm -f ntrix-dados.json   # o arquivo em claro NÃO vai para o repositório
          echo "ntrix-dados.json.enc gerado."

      - name: Salvar no repositório
        run: |
          git config user.name  "ntrix-bot"
          git config user.email "ntrix-bot@users.noreply.github.com"
          git add ntrix-dados.json.enc
          if git diff --staged --quiet; then
            echo "Sem mudanças nos dados."
          else
            git commit -m "Atualiza snapshot NTRIX ($(date -u +%Y-%m-%d))"
            git push
          fi
